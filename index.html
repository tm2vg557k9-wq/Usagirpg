const lawRows=[[113, "無権代理", "代理権を有しない者が他人の代理人としてした契約は、本人がその追認をしなければ、本人に対してその効力を生じない。\n２　追認又はその拒絶は、相手方に対してしなければ、その相手方に対抗することができない。ただし、相手方がその事実を知ったときは、この限りでない。", "権限なしの契約は本人が認めなければ本人に効力が及ばない。追認・拒絶は原則として相手方に伝える。相手方が知っていれば例外。", "対象：無権代理の契約｜条件：本人が追認しない｜結論：本人に効力を生じない｜第2項：相手方への通知と例外", "キツネがくまの許可なく土地を売る契約をした。くまが認めなければ、くまには効力が及ばない。"], [114, "無権代理の相手方の催告権", "前条の場合において、相手方は、本人に対し、相当の期間を定めて、その期間内に追認をするかどうかを確答すべき旨の催告をすることができる。この場合において、本人がその期間内に確答をしないときは、追認を拒絶したものとみなす。", "相手方は本人に期限を決めて返事を求められる。期限内に返事がなければ拒絶扱い。", "主語：相手方｜相手：本人｜条件：相当の期間を定める｜結論：催告できる｜無回答：拒絶とみなす", "リスがくまに返答を求める。善意・悪意を問わず催告できる。"], [115, "無権代理の相手方の取消権", "代理権を有しない者がした契約は、本人が追認をしない間は、相手方が取り消すことができる。ただし、契約の時において代理権を有しないことを相手方が知っていたときは、この限りでない。", "相手方は追認前なら取り消せる。ただし契約時に権限がないと知っていた場合は不可。", "主体：相手方｜条件：追認前｜結論：取消し可能｜例外：契約時に悪意", "リスが権限なしと知らなかったなら、くまの追認前に取り消せる。過失があってもよい。"], [116, "無権代理行為の追認", "追認は、別段の意思表示がないときは、契約の時にさかのぼってその効力を生ずる。ただし、第三者の権利を害することはできない。", "特別な意思表示がなければ追認の効力は契約時に戻る。ただし第三者の権利を害せない。", "対象：追認｜条件：別段の意思表示なし｜結論：契約時に遡及｜制限：第三者の権利", "くまが後日認めると原則として最初の契約時から効力が生じる。"], [117, "無権代理人の責任", "他人の代理人として契約をした者は、自己の代理権を証明したとき、又は本人の追認を得たときを除き、相手方の選択に従い、相手方に対して履行又は損害賠償の責任を負う。\n２　前項の規定は、次に掲げる場合には、適用しない。\n一　他人の代理人として契約をした者が代理権を有しないことを相手方が知っていたとき。\n二　他人の代理人として契約をした者が代理権を有しないことを相手方が過失によって知らなかったとき。ただし、他人の代理人として契約をした者が自己に代理権がないことを知っていたときは、この限りでない。\n三　他人の代理人として契約をした者が行為能力の制限を受けていたとき。", "代理権の証明も追認もなければ、原則として相手方が選ぶ履行か損害賠償の責任を負う。相手方の悪意・過失、代理人の制限行為能力に例外がある。代理人自身が権限なしと知っていた場合、相手方の過失だけでは免責されない。", "主体：無権代理人｜選択：相手方｜結論：履行又は損害賠償｜例外：第2項各号を確認", "リスは要件を満たせばキツネに履行か損害賠償を求められる。"], [521, "契約の締結及び内容の自由", "何人も、法令に特別の定めがある場合を除き、契約をするかどうかを自由に決定することができる。\n２　契約の当事者は、法令の制限内において、契約の内容を自由に決定することができる。", "原則として契約するかどうか、内容をどうするかは自由。法律の制限は守る。", "主体：何人も・当事者｜条件：法令の制限内｜結論：自由に決定できる", "パン屋とリスは法律の範囲内で売買の条件を決められる。"], [522, "契約の成立と方式", "契約は、契約の内容を示してその締結を申し入れる意思表示（以下「申込み」という。）に対して相手方が承諾をしたときに成立する。\n２　契約の成立には、法令に特別の定めがある場合を除き、書面の作成その他の方式を具備することを要しない。", "申込みに相手が承諾すると契約成立。原則として書面などは不要。", "対象：契約｜条件：申込みに対する承諾｜結論：成立｜方式：原則不要、法令に例外あり", "パン屋が100円で売ると申し込み、リスが承諾すれば原則として契約成立。"]];

t='出典・全文：e-Gov法令検索 民法';root.append(link);btn('戻る',()=>root.replaceChildren(...old));}

      body+=r(10,3,6,14,c.edge)+r(11,3,4,14,c.white)+r(12,6,2,9,back?c.light:c.pink);
      body+=r(19,2,6,15,c.edge)+r(20,2,4,15,c.white)+r(21,5,2,10,back?c.light:c.pink);

  function npcVisual(q){
    if(!q) return '';
    if(q.id===2 || /図書館/.test(q.name)) return facilitySprite('library');
    if(/パン屋/.test(q.name)) return facilitySprite('bakery');
    if(/ネズミ/.test(q.name)) return facilitySprite('mouse');
    if(/先生/.test(q.name)) return facilitySprite('school');
    if(q.icon && !/[\u2600-\u27BF\uD83C-\uDBFF\uDC00-\uDFFF]/.test(q.icon)) return q.icon;

      b.onclick=()=>{ if(q&&candidates().some(a=>a.id===q.id)) selectNpc(q.id); else if(player) talk(); else if(Math.abs(x-s.x)+Math.abs(y-s.y)===1) move(x-s.x,y-s.y); else $('status').textContent='隣のマスへ移動してね。'; };

    $('lv').textContent='Lv.'+levelNow()+' '+titleNow();
    $('exp').textContent='⭐ '+s.exp+' EXP';
    $('progress').textContent='📜 '+s.cleared.filter(id=>Q.some(q=>q.id===id)).length+'/'+Q.length;
    let nearby=near();
    $('talkAction').hidden=!choices.length;
    $('talkAction').disabled=!nearby;
    $('talkAction').textContent=nearby?nearby.name+(nearby.id===2?' を調べる':' と話す'):'相手を選択';
    iconifyButton($('talkAction'));
    let list=$('npcChoices'); list.replaceChildren();
    if(choices.length>1) choices.forEach(q=>{
      let b=document.createElement('button'); b.textContent=q.name; b.setAttribute('aria-pressed',String(q.id===selectedNpc)); b.onclick=()=>selectNpc(q.id); list.append(b);
    });
    decorateStaticUI();
  };

  // Ensure patched labels are applied now and after view changes.
  const originalSetView = window.setView;
  window.setView = function(v){ originalSetView(v); decorateStaticUI(); };
  decorateStaticUI();
  if(typeof render==='function') render();
})();
</script>

const emoStart=/^\s*(?:[\p{Extended_Pictographic}\u2600-\u27BF][\uFE0E\uFE0F\u200D\p{Extended_Pictographic}]*)+\s*/u;
function paintPanel(container){
 if(!container)return;
 const nodes=container.querySelectorAll('h2,h3,button');
 for(const el of nodes){
   if(el.dataset.pxHeading==='1'||el.dataset.iconified==='1'||el.querySelector('.pixel-btn-wrap,.px-inline'))continue;
   // Do not rewrite complex controls: preserve child nodes, input state and button events.
   if([...el.childNodes].some(n=>n.nodeType===1))continue;
   const text=el.textContent||'',match=text.match(emoStart);if(!match)continue;
   const meaning=text.slice(match[0].length).trim();if(!meaning)continue;
   const sp=document.createElement('span');sp.className='px-inline';sp.innerHTML=miniature(meaning);
   el.textContent=meaning;el.prepend(sp);el.dataset.pxHeading='1';
 }
}
const panel=$('panel');
let painting=false;
const observer=new MutationObserver(()=>{if(painting)return;painting=true;observer.disconnect();try{paintPanel(panel);}finally{observer.observe(panel,{subtree:true,childList:true,characterData:true});painting=false;}});
observer.observe(panel,{subtree:true,childList:true,characterData:true});paintPanel(panel);
})();

        {q:'一般定期借地権は、存続期間を30年以上とすれば設定できる。',a:false,why:'借地借家法22条。一般定期借地権の存続期間は50年以上。普通借地権の原則30年と区別する。'}]
  };

    return `<svg viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true">${body}</svg>`;

  overlay.innerHTML='<div class="scope-window"><div class="scope-head"><h2>📚 法律の冒険地図・全25単元</h2><button type="button" id="scopeClose">× 閉じる</button></div><div class="scope-toolbar"><p class="scope-intro">LEC「出る順宅建士 合格テキスト① 権利関係」2026年版の公開目次をもとに整理。2027年版の詳細目次は発売後に照合予定。緑の枠は学習クエスト実装済み。借家・借地はミニ問題を先行体験できるよ。</p><div class="scope-tabs" role="group" aria-label="法律の範囲"></div></div><div class="scope-scroll"><div class="scope-grid"></div><p style="font-size:12px;line-height:1.6;margin-top:12px">※ 公開書誌で「共済」と表記されている単元は、以前の版の「弁済」を参考に仮置きしています。LEC独自の解説・問題は転載せず、法令に基づくオリジナル教材として増築します。<br>借地借家法の全文・改正は e-Gov法令検索で確認できます。</p><a href="'+refLink+'" target="_blank" rel="noopener noreferrer">e-Gov 借地借家法を開く</a></div></div>';
