<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#20382b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>うさぎ村の法律冒険記</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;
 background:#20382b;color:#fff;
 font-family:system-ui,sans-serif;
}
main{max-width:480px;margin:auto}
h1{font-size:22px;margin:8px 0}
.stats{
 display:flex;justify-content:space-between;
 background:#354e3d;padding:12px;
 border-radius:12px;margin:12px 0;
}
#map{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:5px;padding:8px;
 background:#354e3d;border-radius:16px;
}
button{
 font:inherit;cursor:pointer;
 touch-action:manipulation;
 -webkit-tap-highlight-color:transparent;
}
.tile{
 aspect-ratio:1;border:0;border-radius:9px;
 background:#829f78;font-size:30px;
 padding:0;
}
.tile.player{background:#e1ecb3}
.controls{
 display:grid;
 grid-template-columns:repeat(3,52px);
 gap:5px;justify-content:center;
 margin:16px 0;
}
.controls button{
 height:44px;border:0;border-radius:12px;
 background:#496452;color:white;font-size:24px;
}
.panel{
 background:#f2e7cd;color:#302b23;
 border-radius:16px;padding:17px;
 line-height:1.7;margin:12px 0;
}
.panel h2{font-size:18px;margin:5px 0}
.action{
 display:block;width:100%;
 border:1px solid #baad91;
 background:#fff8e9;color:#393329;
 border-radius:12px;padding:12px;
 margin:8px 0;
}
small{color:#c3d3c0}
</style>
</head>
<body>
<main>
<h1>🐰 うさぎ村の法律冒険記</h1>
<small>Ver.0.1 森の冒険</small>
<div class="stats">
<span id="level">Lv.1</span>
<span id="exp">⭐ 0 EXP</span>
<span id="progress">📜 0/4</span>
</div>

<div id="map"></div>

<div class="controls">
<span></span>
<button onclick="move(0,-1)">↑</button>
<span></span>
<button onclick="move(-1,0)">←</button>
<button onclick="move(0,1)">↓</button>
<button onclick="move(1,0)">→</button>
</div>

<section class="panel">
<small style="color:#92754e">📜 メインクエスト：代理の謎</small>
<h2 id="speaker">🪽 ルミィ</h2>
<div id="message">
ようこそ、うさぎ村へ！
方向キーで移動して、村の住民を探そう。
</div>
<div id="actions"></div>
</section>

<section class="panel">
<h2>🎒 冒険メニュー</h2>
<button class="action" onclick="hint()">🔮 ことばの万華鏡</button>
<button class="action" onclick="record()">📖 冒険の記録</button>
<button class="action" onclick="save(true)">💾 セーブ</button>
</section>
<small>うさぎ村の法律冒険記・試作版</small>
</main>

<script>
const terrain=[
 "🌲","🌳","📚","🌳","🌲",
 "🌼","🐻","🌷","🦊","🌳",
 "🏠","🌷","🌿","🌼","🌉",
 "🌲","🌳","🦉","🌳","🌲",
 "🍄","🌼","⛲","🌷","🏰"
];

let state={x:2,y:2,exp:0,cleared:[]};

try{
 const data=localStorage.getItem("usagi-rpg-v1");
 if(data)state=JSON.parse(data);
}catch(e){}

const quests={
 6:{
 name:"🐻 くまさん",
 text:"キツネがぼくの許可なく、代理人として契約しちゃったんだ。",
 q:"本人が追認しない限り、無権代理行為の効力は本人に帰属しない。",
 answer:true,
 explain:"民法113条。本人が追認しなければ、原則として本人に契約の効力は帰属しないよ。"
 },
 8:{
 name:"🦊 キツネさん",
 text:"代理権がないのに、代理人として契約してしまったよ。",
 q:"無権代理の相手方は、契約時に無権代理だと知らなければ、過失があっても本人の追認前に取り消せる。",
 answer:true,
 explain:"民法115条。取消権は善意であれば、過失があっても認められるよ。"
 },
 17:{
 name:"🦉 フクロウ先生",
 text:"法律の善意とは、ある事情を知らないことじゃ。",
 q:"法律上の善意とは、親切で誠実な性格のことをいう。",
 answer:false,
 explain:"法律上の善意は、問題となる事情を知らないこと。悪意は知っていることじゃ。"
 },
 2:{
 name:"📚 魔法図書館",
 text:"古い法律書に相続の判例が記されている。",
 q:"本人が無権代理人を単独相続すると、本人は必ず追認しなければならない。",
 answer:false,
 explain:"本人が無権代理人を相続しても追認拒絶は可能。ただし117条責任の承継は別問題だよ。"
 }
};

function render(){
 const map=document.getElementById("map");
 map.innerHTML="";
 terrain.forEach((item,i)=>{
  const x=i%5,y=Math.floor(i/5);
  const player=x===state.x&&y===state.y;
  const b=document.createElement("button");
  b.className="tile"+(player?" player":"");
  b.textContent=player?"🐰":item;
  b.onclick=()=>{
   if(Math.abs(x-state.x)+Math.abs(y-state.y)===1){
    move(x-state.x,y-state.y);
   }else if(player){
    interact();
   }
  };
  map.appendChild(b);
 });
 document.getElementById("level").textContent=
  "Lv."+(1+Math.floor(state.exp/60));
 document.getElementById("exp").textContent=
  "⭐ "+state.exp+" EXP";
 document.getElementById("progress").textContent=
  "📜 "+state.cleared.length+"/4";
}

function say(name,text){
 document.getElementById("speaker").textContent=name;
 document.getElementById("message").textContent=text;
 document.getElementById("actions").innerHTML="";
}

function action(label,fn){
 const b=document.createElement("button");
 b.className="action";
 b.textContent=label;
 b.onclick=fn;
 document.getElementById("actions").appendChild(b);
}

function move(dx,dy){
 const x=state.x+dx,y=state.y+dy;
 if(x<0||x>4||y<0||y>4)return;
 state.x=x;state.y=y;
 render();interact();save(false);
}

function interact(){
 const i=state.y*5+state.x;
 const q=quests[i];
 if(!q){
  say("🪽 ルミィ","村を探索中！ クマ、キツネ、フクロウ先生、図書館を探してね。");
  return;
 }
 say(q.name,q.text);
 action("⚔️ 法律クイズに挑戦",()=>{
  say(q.name,q.q);
  action("⭕ 正しい",()=>judge(i,true));
  action("❌ 誤り",()=>judge(i,false));
 });
}

function judge(i,value){
 const q=quests[i];
 const correct=value===q.answer;
 const first=!state.cleared.includes(i);
 if(correct&&first){
  state.exp+=30;
  state.cleared.push(i);
 }
 say(correct?"✨ 正解！":"🌀 惜しい！",
  q.explain+(correct&&first?" ＋30 EXP！":""));
 action("探索に戻る",()=>{
  say("🪽 ルミィ","次の住民を探そう！");
 });
 if(!correct)action("もう一度挑戦",interact);
 if(state.cleared.length===4){
  action("🏆 クエストクリア",()=>{
   say("🦉 フクロウ先生","見事じゃ！ 代理の謎を解き明かしたな。");
  });
 }
 render();save(false);
}

function hint(){
 say("🔮 ことばの万華鏡",
 "善意＝知らない。無過失＝落ち度がない。追認＝あとから認める。余地はない＝可能性がない。");
}

function record(){
 say("📖 冒険の記録",
 "経験値："+state.exp+" EXP／クリア："+state.cleared.length+"問・全4問");
}

function save(notify){
 try{
  localStorage.setItem("usagi-rpg-v1",JSON.stringify(state));
  if(notify)say("💾 セーブ完了","この端末に冒険の記録を保存したよ！");
 }catch(e){
  if(notify)say("⚠️ 保存できません","ブラウザの保存設定を確認してね。");
 }
}
render();
</script>
</body>
</html>
