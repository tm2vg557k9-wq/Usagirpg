{id:6,x:2,y:2,name:'🐻 くまさん',story:'キツネさんがぼくの許可なく土地の契約を結んだんだ。ぼくはまだ認めていないよ。',q:'本人が追認しない限り、無権代理行為の効力は本人に帰属しない。',easy:'本人があとから認めなければ、無権代理の契約の効果は本人に生じない。',parts:['条件：本人が追認しない限り','主語：無権代理行為の効力','結論：本人に帰属しない'],a:true,why:'民法113条。本人の意思を守るため、権限のない人が勝手に結んだ契約は原則として本人を拘束しない。'},
{id:8,x:8,y:2,name:'🦊 キツネさん',story:'ぼくに代理権がないとは知らずに契約した相手が、契約を取り消したいそうだよ。',q:'無権代理の相手方は、契約時に代理権がないことを知らなければ、過失があっても本人の追認前に取り消すことができる。',easy:'相手は権限がないと知らなかったなら、確認不足でも本人が認める前に契約を取り消せる。',parts:['主語：無権代理の相手方','条件：契約時に代理権がないことを知らない','例外ではない条件：過失があっても','期限：本人の追認前','結論：取り消せる'],a:true,why:'民法115条。相手方を不安定な状態から解放する制度。取消しには善意が必要だが無過失までは不要。'},
{id:17,x:5,y:8,name:'🦉 フクロウ先生',story:'法律の言葉は日常語と意味が異なることがあるぞ。善意とは何かな？',q:'法律上の善意とは、親切で誠実な性格のことをいう。',easy:'法律で善意というのは、性格が優しいという意味だ。',parts:['主題：法律上の善意','結論：親切で誠実な性格をいう'],a:false,why:'善意とは問題となる事情を知らないこと。悪意とは知っていること。性格とは関係ない。'},

const lawRows=[[113, "無権代理", "代理権を有しない者が他人の代理人としてした契約は、本人がその追認をしなければ、本人に対してその効力を生じない。\n２　追認又はその拒絶は、相手方に対してしなければ、その相手方に対抗することができない。ただし、相手方がその事実を知ったときは、この限りでない。", "権限なしの契約は本人が認めなければ本人に効力が及ばない。追認・拒絶は原則として相手方に伝える。相手方が知っていれば例外。", "対象：無権代理の契約｜条件：本人が追認しない｜結論：本人に効力を生じない｜第2項：相手方への通知と例外", "キツネがくまの許可なく土地を売る契約をした。くまが認めなければ、くまには効力が及ばない。"], [114, "無権代理の相手方の催告権", "前条の場合において、相手方は、本人に対し、相当の期間を定めて、その期間内に追認をするかどうかを確答すべき旨の催告をすることができる。この場合において、本人がその期間内に確答をしないときは、追認を拒絶したものとみなす。", "相手方は本人に期限を決めて返事を求められる。期限内に返事がなければ拒絶扱い。", "主語：相手方｜相手：本人｜条件：相当の期間を定める｜結論：催告できる｜無回答：拒絶とみなす", "リスがくまに返答を求める。善意・悪意を問わず催告できる。"], [115, "無権代理の相手方の取消権", "代理権を有しない者がした契約は、本人が追認をしない間は、相手方が取り消すことができる。ただし、契約の時において代理権を有しないことを相手方が知っていたときは、この限りでない。", "相手方は追認前なら取り消せる。ただし契約時に権限がないと知っていた場合は不可。", "主体：相手方｜条件：追認前｜結論：取消し可能｜例外：契約時に悪意", "リスが権限なしと知らなかったなら、くまの追認前に取り消せる。過失があってもよい。"], [116, "無権代理行為の追認", "追認は、別段の意思表示がないときは、契約の時にさかのぼってその効力を生ずる。ただし、第三者の権利を害することはできない。", "特別な意思表示がなければ追認の効力は契約時に戻る。ただし第三者の権利を害せない。", "対象：追認｜条件：別段の意思表示なし｜結論：契約時に遡及｜制限：第三者の権利", "くまが後日認めると原則として最初の契約時から効力が生じる。"], [117, "無権代理人の責任", "他人の代理人として契約をした者は、自己の代理権を証明したとき、又は本人の追認を得たときを除き、相手方の選択に従い、相手方に対して履行又は損害賠償の責任を負う。\n２　前項の規定は、次に掲げる場合には、適用しない。\n一　他人の代理人として契約をした者が代理権を有しないことを相手方が知っていたとき。\n二　他人の代理人として契約をした者が代理権を有しないことを相手方が過失によって知らなかったとき。ただし、他人の代理人として契約をした者が自己に代理権がないことを知っていたときは、この限りでない。\n三　他人の代理人として契約をした者が行為能力の制限を受けていたとき。", "代理権の証明も追認もなければ、原則として相手方が選ぶ履行か損害賠償の責任を負う。相手方の悪意・過失、代理人の制限行為能力に例外がある。代理人自身が権限なしと知っていた場合、相手方の過失だけでは免責されない。", "主体：無権代理人｜選択：相手方｜結論：履行又は損害賠償｜例外：第2項各号を確認", "リスは要件を満たせばキツネに履行か損害賠償を求められる。"], [521, "契約の締結及び内容の自由", "何人も、法令に特別の定めがある場合を除き、契約をするかどうかを自由に決定することができる。\n２　契約の当事者は、法令の制限内において、契約の内容を自由に決定することができる。", "原則として契約するかどうか、内容をどうするかは自由。法律の制限は守る。", "主体：何人も・当事者｜条件：法令の制限内｜結論：自由に決定できる", "パン屋とリスは法律の範囲内で売買の条件を決められる。"], [522, "契約の成立と方式", "契約は、契約の内容を示してその締結を申し入れる意思表示（以下「申込み」という。）に対して相手方が承諾をしたときに成立する。\n２　契約の成立には、法令に特別の定めがある場合を除き、書面の作成その他の方式を具備することを要しない。", "申込みに相手が承諾すると契約成立。原則として書面などは不要。", "対象：契約｜条件：申込みに対する承諾｜結論：成立｜方式：原則不要、法令に例外あり", "パン屋が100円で売ると申し込み、リスが承諾すれば原則として契約成立。"]];

t='出典・全文：e-Gov法令検索 民法';root.append(link);btn('戻る',()=>root.replaceChildren(...old));}

let dojoChapter=0,dojoIndex=0,dojoWrongOnly=false,dojoSession=[];
function dojo(){s.dojo=s.dojo||{};panel('🥋 法律問題道場','全24問のオリジナル○×演習。第1・2・3・5章の問題を収録。何度でも練習できるよ。道場の正誤は別記録で、既存の習熟度や経験値は変えないよ。');
let answered=dojoItems.filter(q=>s.dojo[q.id]),right=answered.filter(q=>s.dojo[q.id].correct);let p=document.createElement('p');p.textContent='挑戦済み '+answered.length+'/24問 ／ 直近正解 '+right.length+'問 ／ 要復習 '+(answered.length-right.length)+'問';$('panel').append(p);
btn('🌈 全章ミックス',()=>dojoStart(0,false));[1,2,3,5].forEach(c=>{let count=dojoItems.filter(q=>q.chapter===c).length;btn(chapters.find(x=>x.id===c).title+'（'+count+'問）',()=>dojoStart(c,false))});btn('📕 間違えた問題だけ',()=>dojoStart(0,true));btn('🏫 学校へ',school)}
function dojoStart(c,wrong){dojoChapter=c;dojoWrongOnly=wrong;dojoIndex=0;dojoSession=dojoItems.filter(q=>(!c||q.chapter===c)&&(!wrong||s.dojo?.[q.id]?.correct===false));dojoQuestion()}
function dojoPool(){return dojoSession}
function dojoQuestion(){const pool=dojoPool();if(!pool.length){panel('🥋 道場','対象の問題はまだないよ。');btn('道場メニュー',dojo);return}if(dojoIndex>=pool.length){dojoEnd();return}const q=pool[dojoIndex];panel('🥋 問題道場　'+(dojoIndex+1)+' / '+pool.length,chapters.find(c=>c.id===q.chapter).title+'　／　第'+q.law+'条');let box=document.createElement('div');box.className='dojo-question';box.textContent=q.q;$('panel').append(box);let hintWrap=document.createElement('div');hintWrap.className='dojo-hint-wrap';let hintButton=document.createElement('button');hintButton.type='button';hintButton.className='dojo-hint-button';hintButton.textContent='💡 ヒントを見る（答えは表示しない）';hintButton.setAttribute('aria-expanded','false');let hintText=document.createElement('div');hintText.className='dojo-hint-text';hintText.hidden=true;const emphasis=[...new Set((q.q.match(/必ず|常に|絶対に|すべて|一切|のみ|限り|原則|例外|場合|とき|第三者|善意|無過失|重大な過失/g)||[]))];const emph=emphasis.length?'特に「'+emphasis.slice(0,5).join('」「')+'」に注目。':'文の中で条件が付いていないか確認しよう。';hintText.textContent='① 誰についての話？（主語）\n② どんな場合の話？（条件・例外）\n③ 何が起きると言っている？（結論）\n'+emph+'\n「必ず」「常に」などの言い切りがあれば、例外がないか考えてみよう。';hintButton.onclick=()=>{hintText.hidden=!hintText.hidden;hintButton.setAttribute('aria-expanded',String(!hintText.hidden));hintButton.textContent=hintText.hidden?'💡 ヒントを見る（答えは表示しない）':'💡 ヒントをしまう'};hintWrap.append(hintButton,hintText);$('panel').append(hintWrap);btn('⭕ 正しい',()=>dojoJudge(q,true));btn('❌ 誤り',()=>dojoJudge(q,false));btn('📚 根拠条文',()=>lawLibrary(String(q.law)));btn('道場メニュー',dojo)}
function dojoJudge(q,choice){const ok=choice===q.a;s.dojo=s.dojo||{};const prev=s.dojo[q.id]||{attempts:0,correctCount:0};s.dojo[q.id]={attempts:prev.attempts+1,correctCount:prev.correctCount+(ok?1:0),correct:ok};save(false);panel(ok?'✨ 正解！':'📕 ここを復習しよう',q.why);let p=document.createElement('p');p.textContent='正解：'+(q.a?'⭕ 正しい':'❌ 誤り')+' ／ あなたの回答：'+(choice?'⭕ 正しい':'❌ 誤り');$('panel').append(p);btn('📚 民法第'+q.law+'条',()=>lawLibrary(String(q.law)));btn('🔄 この問題を再挑戦',()=>{dojoChapter=q.chapter;dojoWrongOnly=false;dojoSession=dojoItems.filter(x=>x.chapter===q.chapter);dojoIndex=dojoSession.findIndex(x=>x.id===q.id);dojoQuestion()});btn('次の問題 →',()=>{dojoIndex++;dojoQuestion()});btn('道場メニュー',dojo)}
function dojoEnd(){const a=dojoItems.filter(q=>(!dojoChapter||q.chapter===dojoChapter));let checked=a.filter(q=>s.dojo?.[q.id]);let right=checked.filter(q=>s.dojo[q.id].correct);panel('🎉 道場の一区切り','この範囲の直近正解：'+right.length+' / '+checked.length+'問。繰り返しだけで習熟度100%にはならないよ。');btn('間違えた問題を復習',()=>dojoStart(dojoChapter,true));btn('道場メニュー',dojo);btn('📊 法律習熟度',mastery)}
