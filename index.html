function save(show){try{localStorage.setItem(key,JSON.stringify(s));if(show)$('status').textContent='💾 セーブ完了'}catch(e){$('status').textContent='保存できませんでした'}}function panel(title,body){if(title!=='🔮 ことばの万華鏡')dictionarySnapshot=null;$('panel').replaceChildren();let h=document.createElement('h2');h.textContent=title;$('panel').append(h);if(body){let p=document.createElement('div');p.textContent=body;$('panel').append(p)}}function btn(label,fn,where=$('panel')){let b=document.createElement('button');b.textContent=label;b.onclick=fn;where.append(b);return b}function move(dx,dy){let x=s.x+dx,y=s.y+dy;if(x<0||y<0||x>10||y>10||['#','~'].includes(tile(x,y))){$('status').textContent='ここは通れないよ。';return}s.x=x;s.y=y;render();save(false);$('status').textContent='';let q=near();if(q)$('status').textContent=q.name+' が近くにいる！「話す」を押そう。'}function near(){return Q.find(q=>Math.abs(q.x-s.x)+Math.abs(q.y-s.y)<=1)}function talk(){let q=near();if(!q){panel('🪽 ルミィ','住民の隣まで移動してね。森には4つのクエストがあるよ。');return}panel(q.name,q.story);btn('📖 ミニ講義',()=>lesson(q));btn('⚔️ クイズに挑戦',()=>quiz(q))}function quiz(q){panel(q.name,q.q);let aid=document.createElement('div');$('panel').append(aid);btn('原文',()=>aid.replaceChildren());btn('🔮 翻訳',()=>{aid.textContent=q.easy});btn('🪶 文章分解',()=>{aid.replaceChildren();q.parts.forEach((p,i)=>{let d=document.createElement('div');d.className='piece';d.style.background=p.startsWith('条件')||p.startsWith('期限')?'#f1e2b6':p.startsWith('結論')?'#e5d8f3':'#dce8f5';d.textContent=p;aid.append(d)})});btn('⭕ 正しい',()=>judge(q,true));btn('❌ 誤り',()=>judge(q,false));btn('辞典を開く',openDictionary)}function judge(q,a){logAnswer(q,a);let correct=a===q.a,first=correct&&!s.cleared.includes(q.id);if(first){s.exp+=30;s.cleared.push(q.id)}panel(correct?'✨ 正解！':'もう一度考えよう',q.why+(first?' ＋30 EXP！':''));if(!correct)reasonButtons(q);btn('問題を見直す',()=>quiz(q));btn('探索へ',home);if(s.cleared.length===4){let p=document.createElement('p');p.textContent='🏆 代理の謎クリア！';$('panel').append(p)}render();save(false)}

['法律用語','追認','あとから正式に認める','事後承認','本人が契約をあとから認める。','無権代理では原則として契約時にさかのぼる。'],['法律用語','善意','問題となる事情を知らない','その事情を認識していない','代理権がないと知らない。','親切という意味ではない。'],['法律用語','悪意','問題となる事情を知っている','その事情を認識している','代理権がないと知っている。','悪人という意味ではない。'],['法律用語','過失','必要な注意を怠ること','注意義務違反','確認すべきことを確認しなかった。','善意と無過失は別。'],['法律用語','帰属する','権利・義務や効果がその人のものになる','効力が生じる、効果が及ぶ','契約の効果が本人に帰属する。','誰に効果が生じるか確認。'],['法律用語','対抗する','相手に権利などを法律上主張する','権利を主張する','土地の所有権を第三者に対抗する。','対抗不能と契約無効は別。'],['法律用語','催告','一定の行為や返答を求める','履行を求める、確答を求める','本人に追認するか返事を求める。','民法114条では相当の期間を定める。'],['法律用語','援用','制度の効果を受けるために主張する','時効を援用する','時効の利益を受けると主張する。','単なる引用とは異なる。'],['硬い表現','余地はない','その可能性はない','認められない、できない','拒絶する余地はない。','否定の対象を読む。'],['硬い表現','妨げない','それを禁止しない','差し支えない','請求することを妨げない。','別の要件が必要な場合もある。'],['硬い表現','にかかわらず','その条件がどうであっても','を問わず、の有無を問わず','善意悪意にかかわらず催告できる。','何を問わないか確認。'],['硬い表現','否か','そうであるかどうか','かどうか','追認するか否か。','否定だけを意味しない。'],['硬い表現','旨','という内容','という趣旨','追認する旨を伝える。','内容を表す。'],['硬い表現','当該','いま問題にしているその','その、該当する','当該契約。','何を指すか確認。'],['硬い表現','確答','はっきりした返事','明確な回答','追認するか確答する。','単なる返事と区別。'],['硬い表現','当然に','法律上、特別な手続などなく','法律上当然に','当然に効力が生じる。','日常語の当たり前とは違う場合がある。'],['硬い表現','別段の定め','通常と異なる取り決め','特別の定め','別段の定めがある場合。','例外条件に注意。'],['硬い表現','限り','その条件が続く間・その範囲内','場合に限る、ない限り','追認しない限り効力は生じない。','否定と組み合わせて読む。'],['混同注意','みなす／推定する','法律上そう扱う／反証がなければそう扱う','擬制／推定','拒絶したものとみなす。','原則として推定は反証可能、みなすは反証で覆せない。'],['混同注意','直ちに／遅滞なく','すぐに／正当な理由なく遅れないように','即時／不当な遅れなく','遅滞なく通知する。','同じ期限を意味しない。'],['混同注意','取消し／解除','取消原因のある行為を取り消す／契約を解消する','取消権／解除権','錯誤による取消し、債務不履行による解除。','要件と効果は制度ごとに確認。']];
let dictionarySnapshot=null;function openDictionary(){if(dictionarySnapshot)return;dictionarySnapshot=Array.from($('panel').childNodes);dictionary(()=>{let nodes=dictionarySnapshot;dictionarySnapshot=null;if(nodes)$('panel').replaceChildren(...nodes);else home()});}function dictionary(back){panel('🔮 ことばの万華鏡','法律用語・硬い表現・混同注意');let input=document.createElement('input');input.placeholder='用語・やさしい意味・類似表現を検索';$('panel').append(input);let sel=document.createElement('select');['すべて','法律用語','硬い表現','混同注意'].forEach(v=>{let o=document.createElement('option');o.textContent=v;sel.append(o)});$('panel').append(sel);let list=document.createElement('div');$('panel').append(list);function update(){list.replaceChildren();words.filter(w=>(sel.value==='すべて'||w[0]===sel.value)&&w.join(' ').includes(input.value.trim())).forEach(w=>{let d=document.createElement('details'),sum=document.createElement('summary');sum.textContent=w[1]+'：'+w[2];d.append(sum);['類似表現：'+w[3],'例：'+w[4],'注意：'+w[5]].forEach(t=>{let p=document.createElement('p');p.textContent=t;d.append(p)});list.append(d)});if(!list.children.length)list.textContent='該当なし'}input.oninput=update;sel.onchange=update;update();btn('戻る',back||home)}
function training(){let items=[['本人は、無権代理行為を追認することを拒絶できる。','主語は？',['本人','無権代理人','相手方'],0,'本人は拒絶できる。'],['本人が追認しない限り、効力は本人に帰属しない。','条件は？',['効力が生じる','本人が追認しない','本人に帰属する'],1,'追認しないことが条件。'],['追認を拒絶する余地はない。','結論は？',['拒絶できる','追認できない','拒絶できない'],2,'余地はない＝可能性はない。']];let i=0;function show(){let a=items[i];panel('🪶 読解修行 '+(i+1)+'/3',a[0]+' '+a[1]);let feedback=document.createElement('p');a[2].forEach((v,j)=>btn(v,()=>{feedback.textContent=(j===a[3]?'⭕ ':'もう一度：')+a[4];if(j===a[3]&&!feedback.dataset.done){feedback.dataset.done='1';btn(i===2?'修行終了':'次へ',()=>{i++;if(i===items.length)home();else show()})}}));$('panel').append(feedback)}show()}function record(){panel('📖 冒険の記録',s.exp+' EXP　クリア '+s.cleared.length+'/4');Q.forEach(q=>{let p=document.createElement('p');p.textContent=(s.cleared.includes(q.id)?'✓ ':'□ ')+q.name;$('panel').append(p)});btn('探索へ',home)}function home(){panel('🪽 ルミィ','森の住民を訪ねて法律語を学ぼう。辞典と羽ペンはいつでも使えるよ。');btn('🏫 法律魔法学校',school)}document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});
s.study=s.study||{};s.boss=s.boss||false;
const lessons={6:['代理とは、本人のために代理人が意思表示をする仕組み。','権限がないキツネが勝手に契約しても、くま本人は原則として拘束されない。本人の意思を守るためだよ。','本人が追認すれば原則として契約時にさかのぼる。ただし第三者の権利を害せない（116条）。'],8:['相手方は契約が有効か分からず困っている。','114条：相当の期間を定めて本人に確答を催告できる。相手方の善意・悪意は問わない。期間内に確答がなければ追認拒絶とみなす。','115条：契約時に代理権がないことを知らなかった相手方は、本人の追認前なら取消しができる。無過失までは不要。'],17:['善意とは事情を知らないこと。悪意とは知っていること。','無過失とは必要な注意を尽くしたこと。善意でも確認不足なら過失がある場合がある。','制度によって善意だけで足りる場合と無過失も必要な場合がある。条件を別々に読むこと。'],2:['本人が無権代理人を単独相続した場合、本人は追認を拒絶できる。','ただし無権代理人が117条の責任を負っていたなら、その責任を相続することがある。','逆に無権代理人が本人を単独相続した場合、追認拒絶などが先にないときは原則として追認拒絶できない。']};
const R=[
{id:106,base:6,name:'くまさん・復習',q:'本人の追認がない場合であっても、無権代理行為の効力は当然に本人に帰属する。',easy:'本人が認めなくても、自動的に本人に契約の効果が生じる。',parts:['条件：本人の追認がない','主語：無権代理行為の効力','結論：当然に本人に帰属する'],a:false,why:'113条。原則として追認がなければ本人に効力は生じない。'},
{id:108,base:8,name:'キツネさん・復習',q:'相手方が代理権の不存在を知っていた場合、本人に対して追認するか否かの催告をする余地はない。',easy:'代理権がないと知っていた相手は、本人に返答を求めることができない。',parts:['条件：相手方が代理権の不存在を知っていた','主語：相手方','結論：催告できない'],a:false,why:'114条。催告は善意悪意を問わない。取消しとは条件が異なる。'},
{id:117,base:17,name:'先生・復習',q:'善意であることは、直ちに無過失であることを意味しない。',easy:'知らなかったからといって、必ず注意不足がなかったとはいえない。',parts:['主語：善意であること','結論：無過失を直ちに意味しない'],a:true,why:'善意と無過失は別々の条件。'},
{id:102,base:2,name:'図書館・復習',q:'本人が無権代理人を単独相続した場合、追認を拒絶できることと117条の責任を承継することは両立し得る。',easy:'本人が契約を認めなくても、無権代理人が負っていた責任を引き継ぐ場合がある。',parts:['条件：本人が無権代理人を単独相続','結論：追認拒絶と責任承継は両立し得る'],a:true,why:'追認による契約の効力と、相続による責任の承継は別問題。'}];
function lesson(q){panel('📖 '+q.name+' のミニ講義',q.story);(lessons[q.id]||[]).forEach((t,i)=>{let d=document.createElement('p');d.textContent=(i+1)+'．'+t;$('panel').append(d)});btn('演習へ',()=>quiz(q));btn('学校へ',school)}
function school(){panel('🏫 法律魔法学校','代理・無権代理の講義 → 演習 → 復習。');Q.forEach(q=>btn(q.name+' の授業',()=>lesson(q)));btn('🪶 読解修行',training);btn('📕 弱点復習',weak);btn('⚔️ ボス戦（個数問題）',boss)}
function logAnswer(q,a){let k=q.base||q.id;let v=s.study[k]||(s.study[k]={total:0,right:0,pending:false,reason:''});v.total++;if(a===q.a){v.right++;if(q.base)v.pending=false}else v.pending=true;save(false)}
function reasonButtons(q){let v=s.study[q.base||q.id];let d=document.createElement('p');d.textContent='どこで迷った？（自己申告・任意）';$('panel').append(d);['知識不足','🐬 想起ミス','読解ミス','まだ分からない'].forEach(t=>btn(t,()=>{v.reason=t;d.textContent='記録：'+t;save(false)}))}
function weak(){panel('📕 弱点カルテ','正答率は今回の更新以降の回答から集計。');Q.forEach(q=>{let v=s.study[q.id];let d=document.createElement('p');d.textContent=q.name+'：'+(v?v.right+'/'+v.total+' 正解'+(v.pending?' ／ 要復習':'')+(v.reason?' ／ '+v.reason:''):'未集計');$('panel').append(d);if(v&&v.pending)btn('別表現で復習',()=>review(R.find(r=>r.base===q.id)))});btn('全論点の別表現演習',()=>review(R[0]));btn('学校へ',school)}
function review(q){panel('🔄 '+q.name,q.q);let d=document.createElement('div');$('panel').append(d);btn('🔮 翻訳',()=>d.textContent=q.easy);btn('🪶 分解',()=>d.textContent=q.parts.join(' ／ '));btn('辞典',openDictionary);[true,false].forEach(a=>btn(a?'⭕ 正しい':'❌ 誤り',()=>{logAnswer(q,a);panel(a===q.a?'✨ 正解':'復習しよう',q.why);if(a!==q.a)reasonButtons(q);btn('もう一度',()=>review(q));let n=R.indexOf(q)+1;if(n<R.length)btn('次の論点',()=>review(R[n]));btn('弱点カルテ',weak)}))}
function boss(){panel('⚔️ ボス戦：代理の試練','正しい記述はいくつある？ 各肢を独立して考えよう。');let statements=[['本人が追認しなければ、無権代理行為は原則として本人に効力を生じない。',true,'113条'],['悪意の相手方は催告できない。',false,'114条：悪意でも催告可能'],['善意の相手方は過失があっても追認前に取消しできる。',true,'115条'],['追認は第三者の権利を害することができる。',false,'116条：第三者の権利を害せない']];let choices=[];statements.forEach((a,i)=>{let d=document.createElement('details');d.open=true;let h=document.createElement('summary');h.textContent=(i+1)+'．'+a[0];d.append(h);let sel=document.createElement('select');['未選択','○','×'].forEach(t=>{let o=document.createElement('option');o.textContent=t;sel.append(o)});d.append(sel);choices.push(sel);$('panel').append(d)});let count=document.createElement('select');['個数を選択','0','1','2','3','4'].forEach(t=>{let o=document.createElement('option');o.textContent=t;count.append(o)});$('panel').append(count);let err=document.createElement('p');$('panel').append(err);btn('判定',()=>{if(choices.some(c=>c.selectedIndex===0)||count.selectedIndex===0){err.textContent='全肢と個数を選ぼう。';return}let ok=choices.every((c,i)=>(c.value==='○')===statements[i][1])&&count.value==='2';panel(ok?'🏆 ボス戦クリア！':'解説を確認しよう','正しい記述は2個。');statements.forEach((a,i)=>{let d=document.createElement('p');d.textContent=(i+1)+'．'+(a[1]?'○':'×')+' '+a[2];$('panel').append(d)});if(ok&&!s.boss){s.boss=true;s.exp+=50;render();save(false)}btn('再挑戦',boss);btn('学校へ',school)})}
words.push(['硬い表現','し得る','する可能性がある','できる場合がある','責任を承継し得る。','必ず起きるとは限らない。'],['硬い表現','不存在','存在しないこと','ないこと','代理権の不存在。','否定の対象に注意。'],['法律用語','承継','権利や義務などを引き継ぐ','相続による承継','責任を承継する。','契約の追認とは別。'],['硬い表現','もっぱら','主として、または専ら','専ら','専ら本人の利益のため。','文脈によって限定の強さが異なる。']);

const sizeSelect=$('mapSize');try{const v=localStorage.getItem('usagi-map-size');if(['small','medium','large'].includes(v))sizeSelect.value=v}catch(e){}function setMapSize(){ $('mapSide').dataset.size=sizeSelect.value;try{localStorage.setItem('usagi-map-size',sizeSelect.value)}catch(e){}}sizeSelect.addEventListener('change',setMapSize);setMapSize();render();home();save(false);
