let selectedNpc=null;let chapter=0;const chapters=[{id:1,title:"🏡 第1章　契約のはじまり",desc:"自然人・法人・契約の成立・書面・拘束力"},{id:2,title:"🪞 第2章　意思表示の庭",desc:"心裡留保・虚偽表示"},{id:3,title:"💎 第3章　真意を探す洞窟",desc:"錯誤・詐欺・強迫"},{id:4,title:"🏫 第4章　守られし者の学び舎",desc:"制限行為能力者"},{id:5,title:"🌳 第5章　代理の森",desc:"代理・無権代理"}];function activeQ(){return Q.filter(q=>chapter===1?q.id>=200:chapter===5?q.id<200:false)}function showChapters(){save(false);chapter=0;selectedNpc=null;$("adventure").hidden=true;$("chapters").hidden=false;let root=$("chapters");root.replaceChildren();let h=document.createElement("h2");h.textContent="📜 冒険する章を選ぼう";root.append(h);chapters.forEach(c=>{let b=document.createElement("button");b.className="chapter-card";b.textContent=c.title;let d=document.createElement("small");d.textContent=c.desc; b.append(d);let t=document.createElement("small");let a=Q.filter(q=>c.id===1?q.id>=200:c.id===5?q.id<200:false);t.textContent=a.length?"クエスト "+a.filter(q=>s.cleared.includes(q.id)).length+"/"+a.length:"今後追加予定";b.append(t);b.disabled=!a.length;b.onclick=()=>enterChapter(c.id);root.append(b)});render();}function enterChapter(id){chapter=id;selectedNpc=null;let pos=(s.chapterPositions||{})[id];s.x=pos?pos.x:5;s.y=pos?pos.y:5;$("chapters").hidden=true;$("adventure").hidden=false;$("chapterTitle").textContent=chapters.find(c=>c.id===id).title;render();home();updateStatus();save(false);window.scrollTo(0,0)}function candidates(){return activeQ().filter(q=>Math.abs(q.x-s.x)+Math.abs(q.y-s.y)<=1)}function selectNpc(id){if(!candidates().some(q=>q.id===id))return;selectedNpc=id;render();updateStatus()}function updateStatus(){let a=candidates(),q=near();$('status').textContent=q?q.name+' を選択中。右下のボタンを押そう。':a.length?'話したい住民をタップして選んでね。':''}function render(){let choices=candidates();if(!choices.some(q=>q.id===selectedNpc))selectedNpc=null;if(choices.length===1)selectedNpc=choices[0].id;const m=$('map');m.replaceChildren();for(let y=0;y<11;y++)for(let x=0;x<11;x++){let t=tile(x,y),q=activeQ().find(a=>a.x===x&&a.y==
